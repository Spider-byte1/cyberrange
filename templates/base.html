<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}CyberRange Lab{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

<header class="topbar">
  <a href="{{ url_for('dashboard') }}" class="brand">
    <span class="brand-mark">⚔</span>
    <span class="brand-name">CYBERRANGE LAB</span>
  </a>
  <nav class="nav-links">
    <a href="{{ url_for('dashboard') }}" class="nav-link {% if active == 'dashboard' %}active{% endif %}">Dashboard</a>
    <a href="{{ url_for('blueteam') }}" class="nav-link {% if active == 'blueteam' %}active{% endif %}">Blue Team Console</a>
    <span class="flag-counter">{{ session.get('captured_flags', [])|length }}/5 flags</span>
    <form method="post" action="{{ url_for('reset') }}" style="display:inline;">
      <button type="submit" class="reset-btn" onclick="return confirm('Reset all patches, flags, and activity log?')">Reset lab</button>
    </form>
  </nav>
</header>

<div class="page">
  {% block content %}{% endblock %}
</div>

<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>

</body>
</html>
